name: .NET CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet --info
      - name: Restore
        run: dotnet restore
      - name: Build (skip MAUI)
        run: |
          find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" \
            | grep -iv "maui" \
            | xargs -I {} dotnet build {} -c Release --no-restore
      - name: Test (if any)
        run: dotnet test -c Release --no-build || echo "No tests yet"
